name: Post to Instagram

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC = 7:00 pm IST, every day
  workflow_dispatch:        # "Run workflow" button for manual posting / testing
    inputs:
      dry_run:
        description: "Test only (don't post)"
        type: boolean
        default: true

permissions:
  contents: write           # lets the job mark posts as "posted" in queue.json

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post next scheduled poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python post_to_instagram.py

      - name: Save updated queue
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "lignex-bot"
            git config user.email "lignex-bot@users.noreply.github.com"
            git commit -am "Mark post as published"
            git push
          fi
